<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.I.A.R. - Panel de Control Agrícola Profesional</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            siar: {
              cream: '#F9F9F5',
              card: '#FFFFFF',
              dark: '#0F3818',
              forest: '#1B3E2B',
              leaf: '#2E7D32',
              bright: '#4CAF50',
              mint: '#D4ECD0',
              mintLight: '#E8F5E9',
              gray: '#8E8E93',
              grayLight: '#EAECE9',
              alertRed: '#D32F2F',
              warningOrange: '#F57C00',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F6F5ED;
      color: #0F3818;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .panel-shadow {
      box-shadow: 0 20px 40px -10px rgba(15, 56, 24, 0.07), 0 1px 4px 0 rgba(15, 56, 24, 0.03);
    }
    .knob-shadow {
      box-shadow: 0 8px 16px -2px rgba(15, 56, 24, 0.35), 0 3px 6px -1px rgba(15, 56, 24, 0.2);
    }
    .smooth-transition {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 lg:p-10 bg-[#F6F5ED]">
  <div id="root" class="w-full max-w-5xl"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AgriculturalControlPanel() {
      // 1. Estados de Encabezado (Tiempo, Clima, Conectividad)
      const [time, setTime] = useState('9:10 AM');
      const [temp, setTemp] = useState(28);
      const [weather, setWeather] = useState('Día Soleado'); // 'Día Soleado' | 'Nublado' | 'Lluvia Ligera'
      const [isBluetoothConnected, setIsBluetoothConnected] = useState(true);

      // 2. Estados de Diagnóstico Agronómico y Sensores
      const [orangePercentage, setOrangePercentage] = useState(65);
      const [leftSensorState, setLeftSensorState] = useState('active'); // 'active' (Verde) | 'alert' (Rojo) | 'inactive' (Gris)
      const [rightSensorState, setRightSensorState] = useState('alert'); // 'active' | 'alert' | 'inactive'

      // 3. Estados de Controles de Movimiento y Telemetría
      const [verticalElevation, setVerticalElevation] = useState(0); // -10 (Descenso/Reverso) a +10 (Elevación/Avance)
      const [horizontalAngle, setHorizontalAngle] = useState(0); // -45° (Izquierda) a +45° (Derecha)
      const [batteryLevel, setBatteryLevel] = useState(75); // 0% a 100%
      const [systemStatus, setSystemStatus] = useState('En Patrullaje Autónomo');

      // Reloj en tiempo real
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          let hours = now.getHours();
          const minutes = now.getMinutes().toString().padStart(2, '0');
          const ampm = hours >= 12 ? 'PM' : 'AM';
          hours = hours % 12 || 12;
          setTime(`${hours}:${minutes} ${ampm}`);
        };
        updateClock();
        const interval = setInterval(updateClock, 10000);
        return () => clearInterval(interval);
      }, []);

      // Lógica interactiva de alternancia de sensores
      const toggleSensor = (sensor) => {
        if (sensor === 'left') {
          const next = leftSensorState === 'active' ? 'alert' : leftSensorState === 'alert' ? 'inactive' : 'active';
          setLeftSensorState(next);
        } else {
          const next = rightSensorState === 'alert' ? 'active' : rightSensorState === 'active' ? 'inactive' : 'alert';
          setRightSensorState(next);
        }
      };

      // Cálculo de mensaje de diagnóstico agronómico según sensores
      const getDiagnosticReport = () => {
        if (leftSensorState === 'alert' && rightSensorState === 'alert') {
          return "Alerta crítica: Estrés severo por tonalidades naranjas en ambos márgenes de cultivo. Se recomienda inspección fitosanitaria inmediata.";
        }
        if (leftSensorState === 'active' && rightSensorState === 'alert') {
          return "Análisis agronómico: Zona izquierda con follaje óptimo. Sensor derecho detecta estrés hídrico y tonalidades naranjas en clorofila.";
        }
        if (leftSensorState === 'alert' && rightSensorState === 'active') {
          return "Análisis agronómico: Zona derecha óptima. Sensor izquierdo requiere revisión por detección de manchas cloróticas tempranas.";
        }
        if (leftSensorState === 'active' && rightSensorState === 'active') {
          return "Condiciones ideales: Cultivo balanceado y libre de anomalías. Follaje verde uniforme en ambos márgenes de la hilera.";
        }
        return "Sensores en espera: Diagnóstico agronómico pausado por el operador. Listo para reanudar escaneo espectral.";
      };

      // Cálculo de color de alerta de sensores
      const getSensorBadge = (state) => {
        if (state === 'active') return { bg: 'bg-[#2E7D32]', text: 'text-[#2E7D32]', label: 'Activo', width: 'w-[80%]' };
        if (state === 'alert') return { bg: 'bg-[#D32F2F]', text: 'text-[#D32F2F]', label: 'Alerta', width: 'w-[75%]' };
        return { bg: 'bg-[#8E8E93]', text: 'text-[#8E8E93]', label: 'Inactivo', width: 'w-[20%]' };
      };

      const leftBadge = getSensorBadge(leftSensorState);
      const rightBadge = getSensorBadge(rightSensorState);

      // SVG Battery Arc Constants (Semicircle Radius = 65, Arc Length = PI * R ≈ 204.2)
      const arcLength = 204.2;
      const arcOffset = arcLength - (arcLength * (batteryLevel / 100));

      return (
        <div class="bg-[#FAF9F5] rounded-[38px] p-6 sm:p-8 lg:p-10 border border-[#E5E8DF] panel-shadow relative overflow-hidden">
          
          {/* Sutil mancha orgánica de fondo decorativa */}
          <div class="absolute -top-16 -right-16 w-56 h-56 rounded-full bg-[#E2EFDA]/50 pointer-events-none blur-2xl"></div>
          <div class="absolute -bottom-16 -left-16 w-56 h-56 rounded-full bg-[#D4ECD0]/40 pointer-events-none blur-2xl"></div>

          {/* ========================================================================= */}
          {/* FILA SUPERIOR: TIEMPO & TEMPERATURA | DIAGNÓSTICO AGRONÓMICO | CLIMA & BT */}
          {/* ========================================================================= */}
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6 items-stretch mb-8 relative z-10">
            
            {/* 1. MÓDULO SUPERIOR IZQUIERDO: HORA Y TEMPERATURA */}
            <div class="lg:col-span-3 bg-[#D4ECD0] border border-[#C3E4BC] rounded-[26px] p-5 flex flex-col justify-center space-y-4 shadow-sm smooth-transition hover:border-[#A8D89E]">
              {/* Hora Actual */}
              <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 rounded-full bg-white/80 flex items-center justify-center text-[#0F3818] shadow-sm">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9" stroke-width="2.4" />
                    <path d="M12 7v5l3 2" stroke-width="2.4" stroke-linecap="round" />
                  </svg>
                </div>
                <div class="flex flex-col">
                  <span class="text-[10px] uppercase font-bold text-[#3B6642] tracking-wider">Hora Local</span>
                  <span class="text-xl sm:text-2xl font-black text-[#0F3818] tracking-tight">{time}</span>
                </div>
              </div>

              {/* Temperatura Ambiente */}
              <div class="flex items-center space-x-3.5">
                <div class="w-11 h-11 rounded-full bg-white/80 flex items-center justify-center text-[#0F3818] shadow-sm">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </div>
                <div class="flex flex-col">
                  <span class="text-[10px] uppercase font-bold text-[#3B6642] tracking-wider">Temperatura</span>
                  <span class="text-xl sm:text-2xl font-black text-[#0F3818] tracking-tight">{temp} °C</span>
                </div>
              </div>
            </div>

            {/* 2. MÓDULO CENTRAL: TARJETA DE DIAGNÓSTICO Y SENSORES */}
            <div class="lg:col-span-6 bg-[#E9EBE8] border border-[#DCE0DA] rounded-[30px] p-6 shadow-sm flex flex-col justify-between smooth-transition hover:border-[#CAD2C7]">
              <div>
                {/* Ícono de Alerta de Fuego Naranja */}
                <div class="flex justify-center mb-2">
                  <div class="w-12 h-12 rounded-2xl bg-orange-100/70 border border-orange-200/80 flex items-center justify-center text-2xl shadow-inner animate-bounce">
                    🔥
                  </div>
                </div>

                {/* Título de Anomalía Corregido Ortográficamente */}
                <h2 class="text-center text-lg sm:text-xl font-extrabold text-[#0F3818] tracking-tight mb-2">
                  Tonalidades Naranjas ({orangePercentage}%)
                </h2>

                {/* Párrafo Descriptivo Dinámico */}
                <p class="text-center text-xs sm:text-sm text-gray-700 leading-relaxed px-2 mb-4 font-medium min-h-[38px]">
                  {getDiagnosticReport()}
                </p>
              </div>

              {/* Barras de Estado de Sensores con Clic Interactivo */}
              <div class="space-y-3.5 pt-2 border-t border-gray-300/60">
                {/* Sensor Izquierdo */}
                <div 
                  onClick={() => toggleSensor('left')}
                  class="cursor-pointer group select-none transition-all p-1.5 -mx-1.5 rounded-xl hover:bg-white/40"
                  title="Haz clic para alternar estado (Activo / Alerta / Inactivo)"
                >
                  <div class="flex justify-between items-center text-xs font-bold text-gray-800 mb-1.5">
                    <span class="flex items-center space-x-2">
                      <span class={`w-2.5 h-2.5 rounded-full ${leftBadge.bg} shadow-sm`}></span>
                      <span class="capitalize text-gray-900 font-extrabold">Sensor Izquierdo</span>
                    </span>
                    <span class={`text-[11px] font-black uppercase tracking-wider ${leftBadge.text} group-hover:scale-105 transition-transform`}>
                      {leftBadge.label} (Alternar)
                    </span>
                  </div>
                  <div class="w-full h-3 bg-[#D2D7D0] rounded-full overflow-hidden flex shadow-inner">
                    <div class={`h-full rounded-full transition-all duration-500 ease-out ${leftBadge.width} ${leftBadge.bg}`}></div>
                  </div>
                </div>

                {/* Sensor Derecho */}
                <div 
                  onClick={() => toggleSensor('right')}
                  class="cursor-pointer group select-none transition-all p-1.5 -mx-1.5 rounded-xl hover:bg-white/40"
                  title="Haz clic para alternar estado (Activo / Alerta / Inactivo)"
                >
                  <div class="flex justify-between items-center text-xs font-bold text-gray-800 mb-1.5">
                    <span class="flex items-center space-x-2">
                      <span class={`w-2.5 h-2.5 rounded-full ${rightBadge.bg} shadow-sm`}></span>
                      <span class="capitalize text-gray-900 font-extrabold">Sensor Derecho</span>
                    </span>
                    <span class={`text-[11px] font-black uppercase tracking-wider ${rightBadge.text} group-hover:scale-105 transition-transform`}>
                      {rightBadge.label} (Alternar)
                    </span>
                  </div>
                  <div class="w-full h-3 bg-[#D2D7D0] rounded-full overflow-hidden flex shadow-inner">
                    <div class={`h-full rounded-full transition-all duration-500 ease-out ${rightBadge.width} ${rightBadge.bg}`}></div>
                  </div>
                </div>
              </div>
            </div>

            {/* 3. MÓDULO SUPERIOR DERECHO: CLIMA Y CONEXIÓN BLUETOOTH */}
            <div class="lg:col-span-3 flex flex-row lg:flex-col justify-around items-center p-3 sm:p-5 space-y-0 lg:space-y-6 bg-white/40 rounded-[26px] border border-white/80">
              
              {/* Clima Interactivo */}
              <div 
                onClick={() => setWeather(weather === 'Día Soleado' ? 'Nublado' : weather === 'Nublado' ? 'Lluvia Ligera' : 'Día Soleado')}
                class="flex flex-col items-center cursor-pointer transition-transform hover:scale-105 group"
                title="Haz clic para alternar estado del clima"
              >
                <div class="w-14 h-14 rounded-2xl bg-amber-50 border border-amber-100 flex items-center justify-center text-amber-500 mb-2 shadow-sm group-hover:rotate-6 transition-transform">
                  {weather === 'Día Soleado' ? (
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="5" fill="#F59E0B" />
                      <path stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                    </svg>
                  ) : weather === 'Nublado' ? (
                    <span class="text-3xl">⛅</span>
                  ) : (
                    <span class="text-3xl">🌧️</span>
                  )}
                </div>
                <span class="text-sm font-extrabold text-[#0F3818] tracking-tight">{weather}</span>
                <span class="text-[10px] text-gray-500 font-bold uppercase">Sensor Óptico</span>
              </div>

              {/* Estado Bluetooth Interactivo */}
              <div 
                onClick={() => setIsBluetoothConnected(!isBluetoothConnected)}
                class="flex flex-col items-center cursor-pointer transition-transform hover:scale-105 group"
                title="Haz clic para conectar/desconectar Bluetooth"
              >
                <div class={`w-14 h-14 rounded-2xl ${isBluetoothConnected ? 'bg-emerald-50 border border-emerald-100 text-[#0F3818]' : 'bg-gray-100 border border-gray-200 text-gray-400'} flex items-center justify-center mb-2 shadow-sm transition-colors`}>
                  <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7 7 10 10-5 5V2l5 5L7 17" />
                  </svg>
                </div>
                <span class={`text-sm font-extrabold tracking-tight ${isBluetoothConnected ? 'text-[#0F3818]' : 'text-gray-500'}`}>
                  {isBluetoothConnected ? 'Conectado' : 'Desconectado'}
                </span>
                <span class="text-[10px] text-gray-500 font-bold uppercase">BLE 5.2 Robot</span>
              </div>

            </div>
          </div>

          {/* DIVISOR HORIZONTAL DE PRECISIÓN */}
          <div class="w-full h-px bg-[#E2E6DC] my-6"></div>

          {/* ========================================================================= */}
          {/* FILA INFERIOR: JOYSTICK VERTICAL | ARCO DE BATERÍA | TRACKPAD HORIZONTAL */}
          {/* ========================================================================= */}
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center pt-2 relative z-10">
            
            {/* 1. MÓDULO INFERIOR IZQUIERDO: JOYSTICK CIRCULAR VERDE VERTICAL */}
            <div class="lg:col-span-4 flex flex-col items-center justify-center">
              <div class="relative w-44 h-44 rounded-full bg-[#288E3E] border-4 border-[#3CB055] flex items-center justify-center knob-shadow transition-transform">
                
                {/* Botón Flecha Arriba (↑) */}
                <button 
                  onClick={() => setVerticalElevation(prev => Math.min(10, prev + 1))}
                  class="absolute top-2.5 text-white/90 hover:text-white active:scale-90 transition-transform p-2 z-20"
                  title="Aumentar Avance / Elevación (+1)"
                >
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 15l7-7 7 7" />
                  </svg>
                </button>

                {/* Botón Central Circular Verde Nítido con Feedback de Estado */}
                <div 
                  onClick={() => setVerticalElevation(0)}
                  class="w-20 h-20 rounded-full bg-[#35A34B] border-2 border-[#4CC263] flex items-center justify-center knob-shadow cursor-pointer smooth-transition active:scale-95 z-10"
                  title="Haz clic para centrar en 0"
                >
                  <div class="w-14 h-14 rounded-full bg-[#288E3E] border border-[#52C86A] flex items-center justify-center shadow-inner">
                    <span class="text-xs font-black text-white">{verticalElevation > 0 ? `+${verticalElevation}` : verticalElevation}</span>
                  </div>
                </div>

                {/* Botón Flecha Abajo (↓) */}
                <button 
                  onClick={() => setVerticalElevation(prev => Math.max(-10, prev - 1))}
                  class="absolute bottom-2.5 text-white/90 hover:text-white active:scale-90 transition-transform p-2 z-20"
                  title="Disminuir Avance / Reverso (-1)"
                >
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M19 9l-7 7-7-7" />
                  </svg>
                </button>
              </div>

              <span class="text-xs font-extrabold text-[#0F3818] mt-3.5 tracking-wider uppercase">
                Control Vertical ({verticalElevation === 0 ? 'Detenido 0' : verticalElevation > 0 ? `Avance +${verticalElevation}` : `Reverso ${verticalElevation}`})
              </span>
            </div>

            {/* 2. MÓDULO INFERIOR CENTRO: ARCO SEMICIRCULAR DE BATERÍA (75%) */}
            <div class="lg:col-span-4 flex flex-col items-center justify-center">
              <div 
                class="relative flex flex-col items-center justify-center cursor-pointer group"
                onClick={() => setBatteryLevel(prev => prev >= 100 ? 25 : prev + 25)}
                title="Haz clic para ajustar la carga de batería (Ciclo 25% → 50% → 75% → 100%)"
              >
                {/* Gráfico SVG de Arco Semicircular de Alta Definición */}
                <svg width="200" height="115" viewBox="0 0 160 90" class="overflow-visible">
                  {/* Arco Base Semicircular */}
                  <path 
                    d="M 15 80 A 65 65 0 0 1 145 80" 
                    fill="none" 
                    stroke="#DCE8D8" 
                    stroke-width="12" 
                    stroke-linecap="round"
                  />
                  {/* Arco Activo Dinámico */}
                  <path 
                    d="M 15 80 A 65 65 0 0 1 145 80" 
                    fill="none" 
                    stroke={batteryLevel > 30 ? "#288E3E" : "#D32F2F"} 
                    stroke-width="12" 
                    stroke-linecap="round"
                    stroke-dasharray="204.2"
                    stroke-dashoffset={arcOffset}
                    class="transition-all duration-700 ease-out"
                  />
                </svg>

                {/* Porcentaje Numérico Central Nítido */}
                <div class="mt-[-28px] flex flex-col items-center">
                  <span class="text-3xl sm:text-4xl font-black text-[#0F3818] tracking-tight">{batteryLevel}%</span>
                  <span class="text-[11px] font-extrabold text-gray-500 uppercase tracking-widest mt-0.5">Batería LiFePO4</span>
                </div>
              </div>

              <span class="text-[10px] text-gray-500 font-bold mt-2 group-hover:text-green-800">
                ⚡ 24.4V • Autonomía est. {Math.round(batteryLevel * 0.12)}h
              </span>
            </div>

            {/* 3. MÓDULO INFERIOR DERECHO: TRACKPAD HORIZONTAL REDISEÑADO */}
            <div class="lg:col-span-4 flex flex-col items-center justify-center">
              <div class="w-full max-w-[240px] h-[84px] bg-[#D4ECD0] border border-[#C2E4BD] rounded-[42px] flex items-center justify-between px-5 shadow-md relative">
                
                {/* Botón Flecha Izquierda (←) */}
                <button 
                  onClick={() => setHorizontalAngle(prev => Math.max(-45, prev - 5))}
                  class="text-[#1E4620] hover:text-[#0F3818] active:scale-90 transition-transform p-2 z-10"
                  title="Viraje a la Izquierda (-5°)"
                >
                  <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M15 19l-7-7 7-7" />
                  </svg>
                </button>

                {/* Botón Central Circular Verde Nítido */}
                <div 
                  onClick={() => setHorizontalAngle(0)}
                  style={{ transform: `translateX(${horizontalAngle * 0.75}px)` }}
                  class="w-16 h-16 rounded-full bg-[#288E3E] border-2 border-[#3CB055] flex items-center justify-center knob-shadow cursor-pointer smooth-transition active:scale-95 z-20"
                  title="Haz clic para alinear al centro (0°)"
                >
                  <div class="w-11 h-11 rounded-full bg-[#207232] border border-[#48B85E] flex items-center justify-center shadow-inner">
                    <span class="text-[10px] font-black text-white">{horizontalAngle}°</span>
                  </div>
                </div>

                {/* Botón Flecha Derecha (→) */}
                <button 
                  onClick={() => setHorizontalAngle(prev => Math.min(45, prev + 5))}
                  class="text-[#1E4620] hover:text-[#0F3818] active:scale-90 transition-transform p-2 z-10"
                  title="Viraje a la Derecha (+5°)"
                >
                  <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M9 5l7 7-7 7" />
                  </svg>
                </button>
              </div>

              <span class="text-xs font-extrabold text-[#0F3818] mt-3.5 tracking-wider uppercase">
                Dirección ({horizontalAngle === 0 ? 'Recto 0°' : horizontalAngle < 0 ? `Viraje Izq ${Math.abs(horizontalAngle)}°` : `Viraje Der ${horizontalAngle}°`})
              </span>
            </div>

          </div>

          {/* ========================================================================= */}
          {/* BARRA INFERIOR DE ACCIONES DE SEGURIDAD Y TELEMETRÍA */}
          {/* ========================================================================= */}
          <div class="mt-8 pt-4 border-t border-[#E5E9DF] flex flex-wrap items-center justify-between gap-4 text-xs font-bold text-gray-600">
            <div class="flex items-center space-x-2.5">
              <span class="w-2.5 h-2.5 rounded-full bg-[#288E3E] animate-pulse"></span>
              <span class="text-[#0F3818] font-extrabold">S.I.A.R. v2.4 • Telemetría Agrícola En Vivo</span>
            </div>
            
            <div class="flex items-center space-x-3">
              <button 
                onClick={() => { setVerticalElevation(0); setHorizontalAngle(0); }}
                class="px-3.5 py-1.5 rounded-xl bg-gray-200 hover:bg-gray-300 text-gray-800 transition-colors font-bold"
              >
                Centrar Controles
              </button>
              <button 
                onClick={() => {
                  setVerticalElevation(0);
                  setHorizontalAngle(0);
                  alert('🛑 PARADA DE EMERGENCIA: Motores y pulverizadores del robot detenidos.');
                }}
                class="px-3.5 py-1.5 rounded-xl bg-[#D32F2F] hover:bg-red-700 text-white transition-colors font-black tracking-wide shadow-sm"
              >
                Parada de Emergencia
              </button>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AgriculturalControlPanel />);
  </script>
</body>
</html>
